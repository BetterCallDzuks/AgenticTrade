services:
  bettercalltrader:
    build: .
    ports:
      - "8080:8080"
    environment:
      # The container must bind all interfaces for the published port to work,
      # so a token is mandatory; compose refuses to start without one.
      COMMAND_CENTER_HOST: 0.0.0.0
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?set DASHBOARD_TOKEN to protect the containerised dashboard}
      # Mutable state lives in the ./data bind mount. Mounting files directly
      # would make Docker create directories when they do not exist yet.
      PAPER_DB_PATH: /app/data/paper_portfolio.db
      AUDIT_LOG_PATH: /app/data/bot_audit.jsonl
      LOG_FILE_PATH: /app/data/bot_history.log
      ML_MODEL_PATH: /app/data/ml_model.json
    env_file:
      # Optional: the token above and the environment block are enough to run.
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    # Hardening: the image already runs as the non-root `bct` user. Make the
    # root filesystem read-only (state goes to the ./data mount and /tmp), drop
    # every Linux capability, and forbid setuid/escalation. Python is told not
    # to write .pyc files in the image.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /ready is authenticated when DASHBOARD_TOKEN is set, so send the same
      # token the service runs with. python:3.11-slim has no curl.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8080/ready",
              headers={"X-Auth-Token": os.environ.get("DASHBOARD_TOKEN", "")},
          )
          sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
