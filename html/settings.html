<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterCallTrader — Postavke</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { sol: { purple: '#9945FF', green: '#14F195', dark: '#0B0E14', card: '#131822', border: '#1E2638' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="webui/theme.css">
    <script src="webui/console.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-sol-purple selection:text-white">

    <header id="bctHeader" class="glass-panel sticky top-0 z-40 sol-gradient-border"></header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 lg:p-6 space-y-5">

        <!-- ACTION BAR -->
        <section class="glass-panel rounded-xl p-4 sol-gradient-border fade-in lg:sticky lg:top-[96px] z-20">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="min-w-0">
                    <h1 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-sliders sol-gradient-text"></i>
                        <span data-i18n="settings.title"></span>
                    </h1>
                    <p class="text-[11px] font-mono text-slate-400 mt-1" data-i18n="settings.subtitle"></p>
                    <div class="flex flex-wrap items-center gap-2 mt-2">
                        <span id="dirtyPill" class="pill warn" style="display:none">
                            <i class="dot"></i><span data-i18n="settings.unsaved"></span>
                        </span>
                        <span class="tiny-mono">
                            <span data-i18n="settings.hash"></span>: <span id="configHash" class="tiny-mono" title="">—</span>
                        </span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" id="discardBtn" class="btn" disabled>
                        <i class="fa-solid fa-rotate-left"></i><span data-i18n="settings.discard"></span>
                    </button>
                    <button type="button" id="saveBtn" class="btn btn-primary" disabled>
                        <i class="fa-solid fa-floppy-disk"></i><span data-i18n="settings.save"></span>
                    </button>
                </div>
            </div>
        </section>

        <!-- STRATEGY PROFILE -->
        <section class="grid grid-cols-1 xl:grid-cols-12 gap-4">
            <div class="xl:col-span-5 glass-panel rounded-xl p-4 fade-in">
                <div class="flex items-center justify-between gap-2 border-b border-sol-border pb-2 mb-3">
                    <h2 class="section-title"><i class="fa-solid fa-layer-group text-sol-green"></i><span data-i18n="settings.profileTitle"></span></h2>
                    <span id="profileBadge" class="pill">—</span>
                </div>
                <label for="profileSelect" class="block text-[10px] font-mono uppercase tracking-wider text-slate-500 mb-1" data-i18n="settings.profileLabel"></label>
                <select id="profileSelect" class="field">
                    <option value="conservative" data-i18n="settings.profile.conservative">conservative</option>
                    <option value="balanced" data-i18n="settings.profile.balanced">balanced</option>
                    <option value="aggressive" data-i18n="settings.profile.aggressive">aggressive</option>
                    <option value="high_risk" data-i18n="settings.profile.high_risk">high_risk</option>
                </select>
                <p class="text-[10px] font-mono text-slate-500 mt-2 leading-relaxed" data-i18n="settings.profileHint"></p>
            </div>

            <div class="xl:col-span-7 glass-panel rounded-xl p-4 fade-in">
                <div class="flex items-center justify-between gap-2 border-b border-sol-border pb-2 mb-3">
                    <h2 class="section-title"><i class="fa-solid fa-circle-info text-sol-purple"></i><span data-i18n="settings.profileNoteTitle"></span></h2>
                    <span class="panel-note">STRATEGY_PROFILE</span>
                </div>
                <ul class="space-y-2 text-[11px] font-mono text-slate-400 leading-relaxed">
                    <li class="flex gap-2"><i class="fa-solid fa-check text-sol-green mt-0.5"></i><span data-i18n="settings.profileNote1"></span></li>
                    <li class="flex gap-2"><i class="fa-solid fa-database text-sol-purple mt-0.5"></i><span data-i18n="settings.profileNote2"></span></li>
                    <li class="flex gap-2"><i class="fa-solid fa-arrow-down-wide-short text-amber-300 mt-0.5"></i><span data-i18n="settings.profileNote3"></span></li>
                </ul>
            </div>
        </section>

        <!-- KNOB GROUPS -->
        <div id="groupsHost" class="space-y-4">
            <div class="glass-panel rounded-xl p-4">
                <div class="empty-state" data-i18n="common.loading"></div>
            </div>
        </div>

        <!-- READ-ONLY -->
        <section class="glass-panel rounded-xl p-4 fade-in">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-sol-border pb-2 mb-3">
                <h2 class="section-title"><i class="fa-solid fa-lock text-amber-300"></i><span data-i18n="settings.readonlyTitle"></span></h2>
                <span class="panel-note" data-i18n="settings.readonlySub"></span>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-2">
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.liveTrading"></div>
                    <div id="roLive" class="v">—</div>
                </div>
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.telegram"></div>
                    <div id="roTelegram" class="v">—</div>
                </div>
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.riskMode"></div>
                    <div id="roRisk" class="v">—</div>
                </div>
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.timezone"></div>
                    <div id="roTimezone" class="v" style="font-size:13px">—</div>
                </div>
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.version"></div>
                    <div id="roVersion" class="v" style="font-size:13px">—</div>
                </div>
                <div class="stat-tile">
                    <div class="k" data-i18n="settings.configHash"></div>
                    <div id="roHash" class="v" style="font-size:11px;word-break:break-all">—</div>
                </div>
            </div>

            <p class="text-[10px] font-mono text-amber-300/80 mt-2 leading-relaxed">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i><span data-i18n="settings.liveFailClosed"></span>
            </p>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-3">
                <details class="glass-inset rounded-lg px-3 py-2">
                    <summary class="cursor-pointer select-none text-[11px] font-mono uppercase tracking-wider text-slate-300">
                        <i class="fa-solid fa-brain text-sol-purple mr-1"></i><span data-i18n="settings.llmTitle"></span>
                    </summary>
                    <div class="mt-2 space-y-2">
                        <label for="llmProvider" class="block text-[10px] font-mono uppercase tracking-wider text-slate-500" data-i18n="settings.llmProviderLabel"></label>
                        <select id="llmProvider" class="field">
                            <option value="auto" data-i18n="settings.llmProvider.auto">auto</option>
                            <option value="gemini" data-i18n="settings.llmProvider.gemini">gemini</option>
                            <option value="local" data-i18n="settings.llmProvider.local">local</option>
                        </select>
                        <label for="llmModel" class="block text-[10px] font-mono uppercase tracking-wider text-slate-500" data-i18n="settings.llmModelLabel"></label>
                        <select id="llmModel" class="field"></select>
                        <p id="llmHint" class="text-[10px] font-mono text-slate-500 leading-relaxed">—</p>
                        <div class="flex items-center gap-2">
                            <button type="button" id="llmApply" class="btn btn-primary" disabled>
                                <i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="settings.llmApply"></span>
                            </button>
                            <button type="button" id="llmReload" class="btn" disabled>
                                <i class="fa-solid fa-rotate"></i><span data-i18n="settings.llmRefresh"></span>
                            </button>
                            <span id="llmStatus" class="text-[10px] font-mono text-slate-500"></span>
                        </div>
                        <div id="roLlm" class="mt-1 max-h-48 overflow-auto text-[10px] font-mono text-slate-300">—</div>
                    </div>
                </details>

                <details class="glass-inset rounded-lg px-3 py-2">
                    <summary class="cursor-pointer select-none text-[11px] font-mono uppercase tracking-wider text-slate-300">
                        <i class="fa-solid fa-door-closed text-rose-400 mr-1"></i><span data-i18n="settings.exitPolicyTitle"></span>
                    </summary>
                    <pre id="roExitPolicy" class="mt-2 max-h-56 overflow-auto text-[10px] font-mono text-slate-300 whitespace-pre-wrap break-all">—</pre>
                </details>
            </div>
        </section>

        <footer class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-sol-border/70 text-[10px] font-mono uppercase tracking-wider text-slate-500">
            <span data-i18n="footer.paper"></span>
            <span><span data-i18n="footer.auth"></span>: <span id="authLabel">off</span> · <span data-i18n="footer.sync"></span>: <span id="footerSync">—</span></span>
        </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

                fields: [
                    "tp1Pct", "tp1Fraction", "stopLossPct", "trailingStopPct",
                    "trailingStopPctAfterTp1", "trailingArmGainPct", "finalTakeProfitPct",
                    "breakevenBufferPct", "moveStopToBreakevenAfterTp1", "fastInvalidationPct",
                    "fastInvalidationWindowSec", "timeStopEnabled", "maxHoldNoPumpSec",
                    "timeStopMinProfitPct", "step1TriggerPct", "step1FloorPct",
                    "step2TriggerPct", "step2FloorPct", "positionMonitorSec"
                ]
            },
            {
                key: "risk",
                icon: "fa-shield-halved",
                accent: "text-amber-300",
                fields: [
                    "maxDailyStopLosses", "maxDailyDrawdownPct", "maxDailyTrades",
                    "clusterCooldownSec", "clusterOpenDdPct", "clusterUnprovenSec"
                ]
            },
            {
                key: "flow",
                icon: "fa-water",
                accent: "text-sky-300",
                fields: ["flowExitEnabled", "flowExitMinSells", "flowExitSellRatio", "whaleExitEnabled"]
            },
            {
                key: "paper",
                icon: "fa-flask-vial",
                accent: "text-sol-purple",
                fields: [
                    "paperSlippageBps", "paperExitSlippageBps", "paperImpactCoeff",
                    "paperImpactExponent", "paperAmmFeeBps", "paperPriorityFeeSol", "paperFailedTxProb"
                ]
            },
            {
                key: "wallet",
                icon: "fa-user-shield",
                accent: "text-cyan-300",
                fields: ["walletQualityWindow", "walletQualityMinSamples", "walletQualityMinWinRate"]
            },
            {
                key: "execution",
                icon: "fa-bolt",
                accent: "text-amber-300",
                fields: ["slippagePct", "jitoTipSol"]
            },
            {
                key: "advanced",
                icon: "fa-flask",
                accent: "text-slate-300",
                fields: []
            }
        ];

        const EXCLUDED = new Set([
            "strategyProfile", "riskMode", "liveTradingEnabled", "telegramEnabled",
            "timezone", "version", "configHash", "costModel", "exitCostModel",
            "exitPolicy", "llm", "liveTradingStage", "liveTradingStageInvalid",
            "stageMaxLiveOrders", "stageOrdersAttempted"
        ]);

        const BOOL_KEYS = new Set([
            "flowExitEnabled", "whaleExitEnabled", "moveStopToBreakevenAfterTp1", "timeStopEnabled"
        ]);

        const PROFILES = ["conservative", "balanced", "aggressive", "high_risk"];

        const UNITS = {
            tradeSizeSol: "SOL",
            minPositionSol: "SOL",
            maxPositionSol: "SOL",
            paperPriorityFeeSol: "SOL",
            jitoTipSol: "SOL",
            minLiquidityUsd: "USD",
            maxTop10Pct: "%",
            tp1Pct: "%",
            stopLossPct: "%",
            trailingStopPct: "%",
            trailingStopPctAfterTp1: "%",
            fastInvalidationPct: "%",
            rejectM5DumpPct: "%",
            maxChaseH1Pct: "%",
            maxDailyDrawdownPct: "%",
            entryConfirmMaxDropPct: "%",
            sizeDrawdownTriggerPct: "%",
            clusterOpenDdPct: "%",
            walletQualityMinWinRate: "%",
            breakevenBufferPct: "%",
            finalTakeProfitPct: "%",
            trailingArmGainPct: "%",
            timeStopMinProfitPct: "%",
            step1TriggerPct: "%",
            step1FloorPct: "%",
            step2TriggerPct: "%",
            step2FloorPct: "%",
            slippagePct: "%",
            minSecondsBetweenEntries: "s",
            stopLossCooldownSec: "s",
            fastInvalidationWindowSec: "s",
            positionMonitorSec: "s",
            entryConfirmSec: "s",
            clusterCooldownSec: "s",
            clusterUnprovenSec: "s",
            stalePriceSec: "s",
            maxHoldNoPumpSec: "s",
            paperSlippageBps: "bps",
            paperExitSlippageBps: "bps",
            paperAmmFeeBps: "bps",
            sizeAfterLossMult: "×",
            sizeHeuristicMult: "×",
            sizeAiOnlyMult: "×",
            sizeDrawdownMult: "×",
            paperFailedTxProb: "0–1",
            flowExitSellRatio: "0–1",
            tp1Fraction: "0–1",
            walletQualityWindow: "n",
            walletQualityMinSamples: "n"
        };

        const $ = (id) => document.getElementById(id);
        const esc = (value) => BCT.escapeHtml(value);

        let config = null;
        let dirty = false;
        let saving = false;

        function setText(id, value, className) {
            const node = $(id);
            if (!node) return;
            node.textContent = value == null || value === "" ? "—" : String(value);
            if (className !== undefined) node.className = className;
        }

        function humanize(key) {
            return String(key || "")
                .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
                .replace(/[_-]+/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .replace(/^./, (c) => c.toUpperCase());
        }

        function hasFieldLabel(key) {
            return Object.prototype.hasOwnProperty.call(I18N.hr, "field." + key);
        }

        function fieldLabel(key) {
            const translated = BCT.t("field." + key);
            return translated && translated !== "field." + key ? translated : humanize(key);
        }

        function isPrimitive(value) {
            return typeof value === "number" || typeof value === "boolean";
        }

        function inputValue(value) {
            if (value == null) return "";
            const n = Number(value);
            return Number.isFinite(n) ? String(n) : "";
        }

        /* ---------------------------------------------------------- rendering */
        function fieldMarkup(key, cfg) {
            const value = cfg[key];
            const isBool = typeof value === "boolean" || BOOL_KEYS.has(key);
            const label = fieldLabel(key);
            const labelAttr = hasFieldLabel(key) ? ` data-i18n="field.${esc(key)}"` : "";
            const unit = UNITS[key]
                ? `<span class="text-[9px] font-mono uppercase tracking-wider text-slate-500">${esc(UNITS[key])}</span>`
                : "";
            const id = `cfg_${esc(key)}`;

            if (isBool) {
                return `<div class="flex items-center justify-between gap-2 glass-inset rounded-lg px-3 py-2 min-w-0">` +
                    `<label class="text-[11px] text-slate-300 truncate" for="${id}"${labelAttr}>${esc(label)}</label>` +
                    `<div class="flex items-center gap-2 shrink-0">${unit}` +
                    `<input type="checkbox" id="${id}" data-key="${esc(key)}"${value ? " checked" : ""}` +
                    ` style="width:16px;height:16px;accent-color:#9945FF;cursor:pointer">` +
                    `</div></div>`;
            }

            const step = value != null && Number.isInteger(Number(value)) ? "1" : "any";
            return `<div class="min-w-0">` +
                `<label class="flex items-baseline justify-between gap-2 mb-1" for="${id}">` +
                `<span class="text-[11px] text-slate-300 truncate"${labelAttr}>${esc(label)}</span>${unit}` +
                `</label>` +
                `<input type="number" inputmode="decimal" class="field" id="${id}" data-key="${esc(key)}"` +
                ` step="${step}" value="${esc(inputValue(value))}">` +
                `</div>`;
        }

        function groupMarkup(group, cfg) {
            const titleKey = `settings.group.${group.key}`;
            const fields = group.fields.map((key) => fieldMarkup(key, cfg)).join("");
            return `<section class="glass-panel rounded-xl p-4 fade-in">` +
                `<div class="flex items-center justify-between gap-2 border-b border-sol-border pb-2 mb-3">` +
                `<h2 class="section-title"><i class="fa-solid ${group.icon} ${group.accent}"></i>` +
                `<span data-i18n="${titleKey}">${esc(BCT.t(titleKey))}</span></h2>` +
                `<span class="panel-note">${group.fields.length}</span>` +
                `</div>` +
                `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">${fields}</div>` +
                `</section>`;
        }

        function renderGroups(cfg) {
            const host = $("groupsHost");
            if (!host || !cfg) return;
            const known = new Set();
            GROUPS.forEach((group) => group.fields.forEach((key) => known.add(key)));
            const extras = Object.keys(cfg)
                .filter((key) => !known.has(key) && !EXCLUDED.has(key) && isPrimitive(cfg[key]))
                .sort();
            const groups = GROUPS
                .map((group) => (group.key === "advanced" ? Object.assign({}, group, { fields: extras }) : group))
                .filter((group) => group.fields.length > 0);
            host.innerHTML = groups.map((group) => groupMarkup(group, cfg)).join("");
        }

        function renderProfileBadge(profile) {
            const badge = $("profileBadge");
            if (!badge) return;
            const high = profile === "high_risk" || (profile === undefined && config && config.riskMode === "high");
            badge.textContent = high ? BCT.t("risk.high") : BCT.t("risk.standard");
            badge.className = high ? "pill offline" : "pill live";
        }

        function renderFlag(id, on, dangerWhenOn) {
            const node = $(id);
            if (!node) return;
            node.textContent = on ? BCT.t("common.on") : BCT.t("common.off");
            node.className = on ? (dangerWhenOn ? "v neg" : "v pos") : "v";
        }

        function renderLiveFlag(cfg) {
            const node = $("roLive");
            if (!node) return;
            const live = Boolean(cfg.liveTradingEnabled);
            if (!live) {
                node.textContent = `${BCT.t("common.off")} · PAPER`;
                node.className = "v pos";
                return;
            }
            const stage = String(cfg.liveTradingStage || "").toLowerCase();
            const labels = { dry_run: "DRY RUN", probe: "PROBE", full: "FULL" };
            let text = cfg.liveTradingStageInvalid
                ? "INVALID → DRY RUN"
                : (labels[stage] || "—");
            if (!cfg.liveTradingStageInvalid && stage === "probe") {
                const used = Number(cfg.stageOrdersAttempted || 0);
                const budget = cfg.stageMaxLiveOrders;
                text += ` ${used}/${budget === undefined || budget === null ? "?" : budget}`;
            }
            node.textContent = `${BCT.t("common.on")} · ${text}`;
            node.className = "v neg";
        }

        function renderLlm(llm) {
            const host = $("roLlm");
            if (!host) return;
            if (llm == null) {
                host.innerHTML = `<div class="text-slate-500">—</div>`;
                return;
            }
            if (typeof llm !== "object") {
                host.innerHTML = `<div style="word-break:break-all">${esc(String(llm))}</div>`;
                return;
            }
            const entries = Object.entries(llm);
            if (!entries.length) {
                host.innerHTML = `<div class="text-slate-500">—</div>`;
                return;
            }
            host.innerHTML = entries.map(([key, value]) => {
                let text;
                if (value == null) text = "—";
                else if (typeof value === "object") text = JSON.stringify(value);
                else if (typeof value === "boolean") text = value ? BCT.t("common.yes") : BCT.t("common.no");
                else text = String(value);
                return `<div class="flex items-start justify-between gap-2 py-1 border-b border-sol-border/50">` +
                    `<span class="text-slate-400 shrink-0">${esc(humanize(key))}</span>` +
                    `<span class="text-slate-300 text-right" style="word-break:break-all">${esc(text)}</span>` +
                    `</div>`;
            }).join("");
        }

        /* ------------------------------------------------ LLM model picker */
        let llmPayload = null;
        let llmLoadedOnce = false;

        function llmSetStatus(text, tone) {
            const node = $("llmStatus");
            if (!node) return;
            node.textContent = text || "";
            const color = tone === "bad" ? "text-rose-300" : tone === "good" ? "text-sol-green" : "text-slate-500";
            node.className = "text-[10px] font-mono " + color;
        }

        function setLlmHint(provider) {
            const node = $("llmHint");
            if (node) node.textContent = BCT.t("settings.llmHint." + (provider || "auto"));
        }

        function llmKnownModels() {
            const known = [];
            const push = (id) => {
                const value = String(id || "").trim();
                if (value && !known.includes(value)) known.push(value);
            };
            ((llmPayload && llmPayload.models) || []).forEach((model) => {
                if (model && (!model.type || model.type === "llm" || model.type === "vlm")) push(model.id);
            });
            ((llmPayload && llmPayload.localModels) || []).forEach(push);
            const selection = (llmPayload && llmPayload.selection) || {};
            push(selection.model);
            return known;
        }

        function renderLlmPicker(payload) {
            llmPayload = payload || {};
            const providerSel = $("llmProvider");
            const modelSel = $("llmModel");
            const applyBtn = $("llmApply");
            const reloadBtn = $("llmReload");
            if (!providerSel || !modelSel) return;
            const selection = llmPayload.selection || {};
            const active = llmPayload.active || {};
            const provider = ["auto", "gemini", "local"].includes(selection.provider)
                ? selection.provider : "auto";
            providerSel.value = provider;
            const wanted = selection.model || (active.local ? active.model : "") || "";
            const models = llmKnownModels();
            modelSel.innerHTML = models.length
                ? models.map((id) => `<option value="${esc(id)}">${esc(id)}</option>`).join("")
                : `<option value="">—</option>`;
            if (wanted && models.includes(wanted)) modelSel.value = wanted;
            modelSel.disabled = provider !== "local" || !models.length;
            if (applyBtn) applyBtn.disabled = false;
            if (reloadBtn) reloadBtn.disabled = false;
            setLlmHint(provider);
            if (!llmPayload.reachable) {
                llmSetStatus(BCT.t("settings.llmNoServer"), "bad");
            } else {
                llmSetStatus("");
            }
        }

        async function loadLlmModels() {
            llmSetStatus(BCT.t("settings.llmLoading"));
            try {
                const payload = await BCT.api("/api/llm/models");
                renderLlmPicker(payload);
            } catch (err) {
                llmSetStatus(err && err.message ? err.message : BCT.t("settings.llmNoServer"), "bad");
            }
        }

        async function applyLlmSelection() {
            const provider = $("llmProvider").value;
            const model = provider === "local" ? $("llmModel").value : "";
            if (provider === "local" && !model) {
                llmSetStatus(BCT.t("settings.llmNoServer"), "bad");
                return;
            }
            llmSetStatus("…");
            try {
                const res = await BCT.api("/api/llm/select", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ provider, model })
                });
                if (!res || !res.ok) throw new Error((res && res.error) || BCT.t("settings.llmApplyFail"));
                const active = (res && res.active) || {};
                const label = active.label || (provider === "local" ? model : provider);
                llmSetStatus(BCT.t("settings.llmApplied", { model: label }), "good");
                if (config) renderReadonly({ ...config, llm: active });
            } catch (err) {
                llmSetStatus(err && err.message ? err.message : BCT.t("settings.llmApplyFail"), "bad");
            }
        }

        function renderReadonly(cfg) {
            cfg = cfg || {};
            renderLiveFlag(cfg);
            renderFlag("roTelegram", Boolean(cfg.telegramEnabled), false);
            setText("roTimezone", cfg.timezone || "—");
            setText("roVersion", cfg.version || "—");
            const high = cfg.riskMode === "high";
            setText("roRisk", high ? BCT.t("risk.high") : BCT.t("risk.standard"), `v ${high ? "neg" : "pos"}`);
            renderLlm(cfg.llm);

            const pre = $("roExitPolicy");
            if (pre) {
                let text = "—";
                try {
                    if (cfg.exitPolicy != null) {
                        text = typeof cfg.exitPolicy === "string"
                            ? cfg.exitPolicy
                            : JSON.stringify(cfg.exitPolicy, null, 2);
                    }
                } catch (err) {
                    text = "—";
                }
                pre.textContent = text;
            }
        }

        function setHash(cfg) {
            const raw = cfg && cfg.configHash ? String(cfg.configHash) : "";
            const node = $("configHash");
            if (node) {
                node.textContent = raw ? (raw.length > 14 ? raw.slice(0, 14) + "…" : raw) : "—";
                node.title = raw;
            }
            const ro = $("roHash");
            if (ro) {
                ro.textContent = raw || "—";
                ro.title = raw;
            }
        }

        /* ---------------------------------------------------------- form state */
        function syncButtons() {
            const loaded = Boolean(config);
            const saveBtn = $("saveBtn");
            const discardBtn = $("discardBtn");
            if (saveBtn) saveBtn.disabled = !loaded || saving;
            if (discardBtn) discardBtn.disabled = !loaded || saving;
        }

        function setDirty(next) {
            dirty = Boolean(next);
            const pill = $("dirtyPill");
            if (pill) pill.style.display = dirty ? "" : "none";
            syncButtons();
        }

        function populateForm(cfg) {
            if (!cfg) return;
            renderGroups(cfg);
            const select = $("profileSelect");
            if (select) {
                const profile = PROFILES.indexOf(cfg.strategyProfile) >= 0 ? cfg.strategyProfile : "balanced";
                select.value = profile;
                renderProfileBadge(profile);
            }
            syncButtons();
        }

        function collect() {
            const payload = {};
            document.querySelectorAll("#groupsHost [data-key]").forEach((el) => {
                const key = el.dataset.key;
                if (!key) return;
                if (el.type === "checkbox") {
                    payload[key] = Boolean(el.checked);
                    return;
                }
                if (el.value === "" || el.value == null) return;
                const num = Number(el.value);
                if (Number.isFinite(num)) payload[key] = num;
            });
            const select = $("profileSelect");
            if (select && select.value) payload.strategyProfile = select.value;
            return payload;
        }

        /* ---------------------------------------------------------- data flow */
        async function refresh() {
            const state = await BCT.api("/api/state");
            const next = state && state.config;
            if (!next || typeof next !== "object") {
                throw new Error(BCT.t("settings.toastLoadFail"));
            }
            config = next;
            setHash(config);
            renderReadonly(config);
            if (!llmLoadedOnce) {
                llmLoadedOnce = true;
                loadLlmModels();
            }
            if (!dirty) {
                populateForm(config);
            } else {
                syncButtons();
            }
            setText("authLabel", BCT.token() ? "token" : "off");
            BCT.setConnection(true);
        }

        function markDirty() {
            if (!config) return;
            setDirty(true);
        }

        async function save() {
            if (saving || !config) return;
            saving = true;
            syncButtons();
            const payload = collect();
            try {
                const res = await BCT.api("/api/config", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const changed = res && Array.isArray(res.changed) ? res.changed : [];
                BCT.toast(BCT.t("settings.toastSaved", { n: changed.length }));
                if (res && res.config) {
                    config = res.config;
                    populateForm(config);
                    renderReadonly(config);
                    setHash(config);
                }
                setDirty(false);
                if (!res || !res.config) await refresh();
            } catch (err) {
                BCT.toast(err && err.message ? err.message : BCT.t("toast.failed"));
            } finally {
                saving = false;
                syncButtons();
            }
        }

        $("saveBtn").addEventListener("click", save);

        $("discardBtn").addEventListener("click", async () => {
            setDirty(false);
            try {
                await refresh();
                BCT.toast(BCT.t("settings.toastDiscarded"));
            } catch (err) {
                BCT.toast(err && err.message ? err.message : BCT.t("toast.syncFail"));
            }
        });

        $("groupsHost").addEventListener("input", markDirty);
        $("groupsHost").addEventListener("change", markDirty);

        $("profileSelect").addEventListener("change", () => {
            markDirty();
            renderProfileBadge($("profileSelect").value);
        });

        $("llmProvider").addEventListener("change", () => {
            const provider = $("llmProvider").value;
            $("llmModel").disabled = provider !== "local" || !llmKnownModels().length;
            setLlmHint(provider);
        });
        $("llmApply").addEventListener("click", applyLlmSelection);
        $("llmReload").addEventListener("click", loadLlmModels);

        window.addEventListener("beforeunload", (event) => {
            if (!dirty) return;
            event.preventDefault();
            event.returnValue = "";
            return "";
        });

        BCT.init({ page: "settings", i18n: I18N, onRefresh: refresh, poll: 0 });
    })();
    </script>
</body>
</html>
