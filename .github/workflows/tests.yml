name: BetterCallTrader tests

on:
  push:
  pull_request:

env:
  # setup-python guarantees this interpreter on every runner. bootstrap.sh uses
  # it to create the project venv, exactly like a local ./run.sh does.
  PYTHON_BIN: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bootstrap venv (shared with ./run.sh)
        run: bash ./bootstrap.sh --dev
      - name: Shell script syntax
        run: bash -n bootstrap.sh run.sh backup.sh restore.sh
      - name: Ruff
        run: |
          "$VENV_PY" -m ruff check .
      - name: Mypy (bettercalltrader package)
        run: |
          "$VENV_PY" -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bootstrap venv (shared with ./run.sh)
        shell: bash
        run: bash ./bootstrap.sh
      - name: Config doctor
        shell: bash
        run: |
          "$VENV_PY" -m bettercalltrader.doctor --no-port-check --no-info
        env:
          PYTHONIOENCODING: utf-8
      - name: Run self-tests
        shell: bash
        run: |
          "$VENV_PY" test_v9.py
        env:
          PYTHONIOENCODING: utf-8
      - name: API smoke test
        shell: bash
        run: |
          "$VENV_PY" smoke_v10.py
        env:
          PYTHONIOENCODING: utf-8

  launcher:
    # Proves the Linux entry point from the README actually boots the dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Start through ./run.sh and probe the dashboard
        run: |
          set -uo pipefail
          COMMAND_CENTER_PORT=18080 bash ./run.sh --skip-doctor > run.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/"; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat run.log
          if [ "$ok" -ne 1 ]; then
            echo "::error::the dashboard did not respond on http://127.0.0.1:18080/"
            exit 1
          fi
          echo "dashboard responded on port 18080"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Bootstrap venv (shared with ./run.sh)
        run: bash ./bootstrap.sh --dev
      - name: Audit pinned runtime dependencies
        run: |
          "$VENV_PY" -m pip_audit -r requirements.txt
