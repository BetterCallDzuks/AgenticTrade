name: BetterCallTrader tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # setup-python guarantees this interpreter on every runner. scripts/bootstrap.sh uses
  # it to create the project venv, exactly like a local ./run.sh does.
  PYTHON_BIN: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bootstrap venv (shared with ./run.sh)
        run: bash ./scripts/bootstrap.sh --dev
      - name: Shell script syntax
        run: bash -n scripts/bootstrap.sh run.sh scripts/backup.sh scripts/restore.sh
      - name: Ruff
        run: |
          "$VENV_PY" -m ruff check .
      - name: Mypy (bettercalltrader package)
        run: |
          "$VENV_PY" -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bootstrap venv (shared with ./run.sh)
        shell: bash
        run: bash ./scripts/bootstrap.sh
      - name: Config doctor
        shell: bash
        run: |
          "$VENV_PY" -m bettercalltrader.doctor --no-port-check --no-info
        env:
          PYTHONIOENCODING: utf-8
      - name: Run self-tests
        shell: bash
        run: |
          "$VENV_PY" py/test_v9.py
        env:
          PYTHONIOENCODING: utf-8
      - name: API smoke test
        shell: bash
        run: |
          "$VENV_PY" py/smoke_v10.py
        env:
          PYTHONIOENCODING: utf-8

  launcher:
    # Proves the Linux entry point from the README actually boots the dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Start through ./run.sh and probe the dashboard
        run: |
          set -uo pipefail
          COMMAND_CENTER_PORT=18080 bash ./run.sh --skip-doctor > run.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080/"; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat run.log
          if [ "$ok" -ne 1 ]; then
            echo "::error::the dashboard did not respond on http://127.0.0.1:18080/"
            exit 1
          fi
          echo "dashboard responded on port 18080"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Bootstrap venv (shared with ./run.sh)
        run: bash ./scripts/bootstrap.sh --dev
      - name: Audit pinned runtime dependencies
        run: |
          "$VENV_PY" -m pip_audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose config is valid
        env:
          DASHBOARD_TOKEN: ci-token
        run: docker compose config > /dev/null
      - name: Build the image
        run: docker build -t bettercalltrader:test .
      - name: Image runs as non-root
        run: test "$(docker run --rm bettercalltrader:test id -u)" = "1000"
      - name: Run hardened and wait for /ready
        run: |
          set -euo pipefail
          docker volume create bct-ci-data >/dev/null
          cid="$(docker run -d --name bct-ci \
            -e COMMAND_CENTER_HOST=0.0.0.0 \
            -e DASHBOARD_TOKEN=ci-token \
            -e PAPER_DB_PATH=/app/data/paper_portfolio.db \
            -e AUDIT_LOG_PATH=/app/data/bot_audit.jsonl \
            -e LOG_FILE_PATH=/app/data/bot_history.log \
            -e ML_MODEL_PATH=/app/data/ml_model.json \
            -p 18080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -v bct-ci-data:/app/data \
            bettercalltrader:test)"
          cleanup() {
            docker rm -f bct-ci >/dev/null 2>&1 || true
            docker volume rm bct-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -H "X-Auth-Token: ci-token" http://127.0.0.1:18080/ready >/dev/null; then
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs "$cid"
          if [ "$ok" -ne 1 ]; then
            echo "::error::hardened container did not become ready"
            exit 1
          fi
          echo "hardened container reached /ready"
