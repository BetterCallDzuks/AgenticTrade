[project]
name = "bettercalltrader"
version = "13.0.0"
description = "Paper-first Solana memecoin trading bot with an AI research agent and a local Command Center."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [".git", "__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# Start with correctness rules only so the legacy monolith can be cleaned
# incrementally. Expand the selection as the codebase is modularized.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The legacy entry point loads .env before importing package modules.
"py/research_bot.py" = ["E402"]
"py/replay_v10.py" = ["E402"]
"py/test_v9.py" = ["E402", "F401"]
"py/smoke_v10.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
files = ["bettercalltrader"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.run]
# The self-tests are the coverage driver; the helper scripts are executed, not
# imported, so they would otherwise count as 0% and drag the total down.
source = ["bettercalltrader", "py"]
omit = [
    "py/test_v9.py",
    "py/smoke_v10.py",
    "py/eval_models.py",
    "py/replay_v10.py",
    "py/export_training.py",
]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 68% on the v13 tree; 65 leaves room for unrelated edits without
# hiding a real drop in coverage. Raise it only together with new tests.
fail_under = 65

# The legacy monolith is still being extracted; keep CI green while the
# modular package stays fully type-checked.
[[tool.mypy.overrides]]
module = "research_bot"
ignore_errors = true
