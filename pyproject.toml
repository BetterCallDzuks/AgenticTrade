[project]
name = "agentictrade"
version = "11.0.0"
description = "Paper-first Solana memecoin trading bot with an AI research agent and a local Command Center."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [".git", "__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# Start with correctness rules only so the legacy monolith can be cleaned
# incrementally. Expand the selection as the codebase is modularized.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The legacy entry point loads .env before importing package modules.
"research_bot.py" = ["E402"]
"test_v9.py" = ["E402", "F401"]
"smoke_v10.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
files = ["agentictrade"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

# The legacy monolith is still being extracted; keep CI green while the
# modular package stays fully type-checked.
[[tool.mypy.overrides]]
module = "research_bot"
ignore_errors = true
